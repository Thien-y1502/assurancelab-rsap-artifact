name: reproduce-rsap

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile RSAP/run_rsap.py
      - run: python RSAP/run_rsap.py
      - run: python -c "import json; assert json.load(open('RSAP/results.json'))['status'] == 'PASS'"
